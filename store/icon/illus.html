<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  /* Onboarding illustrations: floating app cards on a transparent canvas, drawn
     over the brand gradient in the app. No sentences, so they need no translation.
     ?n=1..4 picks the slide; ?bg=1 adds the gradient for previewing. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 900px; height: 760px; overflow: hidden; background: transparent; }
  body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: #17171A; position: relative; -webkit-font-smoothing: antialiased; }
  body.bg { background: linear-gradient(135deg, #FFA23F, #F6821F 38%, #D0559C 70%, #7C5CF0); }
  .card { position: absolute; background: #fff; border-radius: 34px; box-shadow: 0 30px 60px rgba(60,20,80,.28); padding: 30px; }
  .row { display: flex; align-items: center; gap: 20px; }
  .ic { width: 68px; height: 68px; border-radius: 50%; background: #F3F3F5; display: flex; align-items: center; justify-content: center; flex: none; }
  .ic svg { width: 32px; height: 32px; stroke: #6E6E76; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ic.o { background: #FDEBD9; } .ic.o svg { stroke: #F6821F; }
  .bar { height: 16px; border-radius: 8px; background: #E7E7EA; }
  .bar.d { background: #C9C9CF; }
  .t { font-size: 34px; font-weight: 700; letter-spacing: -.6px; }
  .big { font-size: 58px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #10B981; box-shadow: 0 0 0 7px rgba(16,185,129,.18); }
  .badge { min-width: 104px; height: 50px; border-radius: 14px; background: #F3F3F5; font-size: 22px; font-weight: 700; color: #6E6E76; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
  .sep { height: 2px; background: #EEEEF0; margin: 22px 0; }
  .tog { width: 86px; height: 50px; border-radius: 25px; background: linear-gradient(120deg, #FFA23F, #F6821F 45%, #9B5BEA); position: relative; flex: none; }
  .tog::after { content: ''; position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border-radius: 50%; background: #fff; }
  .tog.off { background: #DADADF; } .tog.off::after { right: auto; left: 6px; }
  .grow { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .cloud svg { width: 40px; height: 40px; fill: none; stroke: #F6821F; stroke-width: 2.4; stroke-linejoin: round; }
  .pill { height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex: 1; }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
if (q.get('bg')) document.body.className = 'bg';
const I = {
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.6-3.2 7.7-8 9-4.800-1.300-8-4.400-8-9V6z"/><path d="M8.800 12.200l2.200 2.200 4.200-4.400"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.500"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  code: '<svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 3c.6 4.800 3.200 7.400 8 8-4.800.600-7.400 3.200-8 8-.600-4.800-3.200-7.400-8-8 4.800-.600 7.400-3.200 8-8z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>',
  cloud: '<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .7-7.940A6 6 0 0 0 6.200 9.200 4.500 4.500 0 0 0 7 18z"/></svg>',
};
const rec = (type, w) => `<div class="row"><div class="badge">${type}</div><div class="grow"><div class="bar d" style="width:${w}px"></div><div class="bar" style="width:${w * .62}px"></div></div><div class="cloud">${I.cloud}</div></div>`;
const setting = (icon, w, on) => `<div class="row"><div class="ic">${I[icon]}</div><div class="grow"><div class="bar d" style="width:${w}px"></div><div class="bar" style="width:${w * .7}px"></div></div><div class="tog ${on ? '' : 'off'}"></div></div>`;

const SLIDES = {
  // Domains and DNS
  1: `
    <div class="card" style="left:90px;top:120px;width:640px;transform:rotate(-3deg)">
      <div class="row"><div class="ic">${I.globe}</div><div class="grow"><div class="t">northwind.dev</div><div class="bar" style="width:210px"></div></div><div class="dot"></div></div>
      <div class="sep"></div>
      ${rec('A', 250)}<div class="sep"></div>${rec('CNAME', 200)}<div class="sep"></div>${rec('MX', 230)}
    </div>
    <div class="card" style="left:570px;top:550px;width:250px;transform:rotate(5deg);padding:26px 30px">
      <div class="bar" style="width:110px;margin-bottom:16px"></div><div class="row" style="gap:14px"><div class="big">6</div><div class="dot"></div></div>
    </div>`,
  // Analytics
  2: `
    <div class="card" style="left:110px;top:150px;width:660px;transform:rotate(2deg)">
      <div class="row" style="margin-bottom:24px"><div class="grow"><div class="bar d" style="width:230px"></div></div><div class="badge" style="background:#F6821F;color:#fff;min-width:74px">7d</div><div class="badge" style="min-width:74px">30d</div></div>
      <svg viewBox="0 0 600 260" style="width:100%;display:block">
        <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6821F" stop-opacity=".32"/><stop offset="1" stop-color="#F6821F" stop-opacity="0"/></linearGradient></defs>
        <path d="M0 65H600M0 130H600M0 195H600" stroke="#EEEEF0" stroke-width="2"/>
        <path d="M0 200 C60 190 90 120 150 130 S250 180 300 110 S400 40 450 70 S550 60 600 20 V260 H0Z" fill="url(#a)"/>
        <path d="M0 200 C60 190 90 120 150 130 S250 180 300 110 S400 40 450 70 S550 60 600 20" fill="none" stroke="#F6821F" stroke-width="7" stroke-linecap="round"/>
        <path d="M0 230 C70 225 110 190 160 195 S260 215 310 180 S410 150 460 160 S560 150 600 130" fill="none" stroke="#9B5BEA" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
      </svg>
    </div>
    <div class="card" style="left:60px;top:50px;width:250px;transform:rotate(-6deg);padding:26px 30px">
      <div class="bar" style="width:100px;margin-bottom:16px"></div><div class="big">2.2M</div>
    </div>
    <div class="card" style="left:560px;top:500px;width:270px;transform:rotate(-4deg);padding:26px 30px">
      <div class="bar" style="width:120px;margin-bottom:16px"></div><div class="big" style="color:#10B981">74%</div>
      <div style="height:14px;border-radius:7px;background:#E7E7EA;margin-top:18px"><div style="width:74%;height:100%;border-radius:7px;background:#10B981"></div></div>
    </div>`,
  // Security and performance
  3: `
    <div class="card" style="left:120px;top:130px;width:640px;transform:rotate(-2deg)">
      ${setting('shield', 250, true)}<div class="sep"></div>${setting('lock', 210, true)}<div class="sep"></div>${setting('code', 230, false)}
    </div>
    <div class="card" style="left:590px;top:470px;width:230px;height:230px;border-radius:50%;transform:rotate(6deg);display:flex;align-items:center;justify-content:center;padding:0">
      <svg viewBox="0 0 24 24" style="width:120px;height:120px;fill:none;stroke:#F6821F;stroke-width:1.800;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3l8 3v6c0 4.600-3.200 7.700-8 9-4.800-1.300-8-4.400-8-9V6z"/><path d="M8.800 12.200l2.200 2.200 4.200-4.400"/></svg>
    </div>
    <div class="card" style="left:70px;top:520px;width:300px;transform:rotate(4deg);padding:24px 28px">
      <div class="row"><div class="ic o">${I.lock}</div><div class="t">TLS 1.3</div></div>
    </div>`,
  // AI assistant
  4: `
    <div class="card" style="left:300px;top:60px;width:500px;transform:rotate(2deg);background:#2B2147;border-radius:34px 34px 10px 34px">
      <div class="bar" style="width:380px;background:rgba(255,255,255,.9);margin-bottom:14px"></div><div class="bar" style="width:240px;background:rgba(255,255,255,.65)"></div>
    </div>
    <div class="card" style="left:90px;top:230px;width:620px;transform:rotate(-2deg)">
      <div class="row" style="align-items:flex-start"><div class="ic o">${I.spark}</div><div class="grow" style="padding-top:8px"><div class="bar d" style="width:400px"></div><div class="bar" style="width:440px"></div><div class="bar" style="width:260px"></div></div></div>
      <div class="sep"></div>
      <div class="row" style="margin-bottom:22px"><div class="badge">A</div><div class="t" style="font-size:28px">shop → 203.0.113.50</div></div>
      <div class="row"><div class="pill" style="border:2.500px solid #E7E7EA;color:#A3A3AB"><div class="bar" style="width:110px"></div></div>
        <div class="pill" style="background:#F6821F"><svg viewBox="0 0 24 24" style="width:38px;height:38px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></div></div>
    </div>
    <div class="card" style="left:590px;top:500px;width:220px;height:220px;border-radius:50%;transform:rotate(5deg);padding:0;display:flex;align-items:center;justify-content:center">
      <svg viewBox="0 0 120 120" style="position:absolute;inset:18px;width:184px;height:184px"><circle cx="60" cy="60" r="50" fill="none" stroke="#E7E7EA" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-dasharray="289 314" transform="rotate(-90 60 60)"/></svg>
      <div class="big" style="font-size:66px">92</div>
    </div>`,
};
document.body.insertAdjacentHTML('beforeend', SLIDES[q.get('n') || 1]);
</script>
</body>
</html>
