<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: #fff;
    background: linear-gradient(102deg, #FF9838 0%, #F6821F 28%, #EE6A4A 52%, #B455C6 76%, #7C5CF0 100%);
    -webkit-font-smoothing: antialiased;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); }
  .copy { position: absolute; left: 56px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .brand img { width: 68px; height: 68px; border-radius: 18px; box-shadow: 0 12px 28px rgba(40,10,60,.3); }
  .brand span { font-size: 25px; font-weight: 700; letter-spacing: -.3px; }
  h1 { font-size: 53px; line-height: 1.06; font-weight: 800; letter-spacing: -1.6px; white-space: pre-line; text-shadow: 0 2px 20px rgba(90,30,0,.18); }
  p { margin-top: 16px; font-size: 20px; line-height: 1.4; font-weight: 500; color: rgba(255,255,255,.93); max-width: 440px; }
  .tag {
    display: inline-flex; align-items: center; align-self: flex-start; height: 32px; padding: 0 14px; margin-top: 22px;
    border-radius: 999px; background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.45);
    font-size: 14px; font-weight: 700;
  }
  .phone {
    position: absolute; width: 260px; padding: 6px; border-radius: 34px; background: #101012;
    box-shadow: 0 30px 60px rgba(40,10,60,.42);
  }
  .screen { width: 248px; height: 551px; border-radius: 29px; overflow: hidden; background: #F0F0F1; position: relative; }
  .screen img { display: block; width: 248px; }
  .screen i { position: absolute; top: 0; left: 0; right: 0; height: 22px; background: #F0F0F1; display: block; }
  .zoom {
    position: absolute; overflow: hidden; background: #fff; border: 6px solid #fff; border-radius: 50%;
    box-shadow: 0 24px 50px rgba(40,10,60,.45);
  }
  .zoom img { position: absolute; display: block; }
</style>
</head>
<body>
<div class="glow" style="left:-80px;top:260px;width:420px;height:420px;background:rgba(255,255,255,.2)"></div>
<div class="glow" style="left:560px;top:-160px;width:460px;height:460px;background:rgba(255,220,160,.3)"></div>

<div class="copy">
  <div class="brand"><img src="icon.png" alt=""><span>CloudFlare Mobile</span></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <span class="tag" id="tag"></span>
</div>

<div class="phone" style="left:560px;top:74px;transform:rotate(-7deg)"><div class="screen"><img id="p1" alt=""><i></i></div></div>
<div class="phone" style="left:770px;top:20px;transform:rotate(6deg)"><div class="screen"><img id="p2" alt=""><i></i></div></div>
<div class="zoom" id="lens" style="left:668px;top:262px;width:206px;height:206px"><img id="p3" alt=""></div>

<script>
const lang = new URLSearchParams(location.search).get('lang') || 'en';
const copy = {
  en: ['Manage Cloudflare\nfrom your phone', 'DNS, firewall, analytics, Workers and an AI assistant in one clean app.', 'Unofficial client for Cloudflare'],
  id: ['Kelola Cloudflare\ndari HP kamu', 'DNS, firewall, analitik, Workers, dan asisten AI dalam satu aplikasi.', 'Klien tidak resmi untuk Cloudflare'],
}[lang];
document.getElementById('title').textContent = copy[0];
document.getElementById('sub').textContent = copy[1];
document.getElementById('tag').textContent = copy[2];
document.getElementById('p1').src = `raw/${lang}/dashboard.png`;
document.getElementById('p2').src = `raw/${lang}/analytics.png`;
// Round lens on the AI audit score ring (centre 612,568 in a 1224px-wide shot).
const z = 194 / 400;
const p3 = document.getElementById('p3');
p3.src = `raw/${lang}/audit.png`;
p3.style.cssText = `width:${1224 * z}px;left:${-(612 - 200) * z}px;top:${-(568 - 200) * z}px`;
</script>
</body>
</html>
